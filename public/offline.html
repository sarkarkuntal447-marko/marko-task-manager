<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffd512" />
    <title>Offline — Marko Projects</title>
    <link rel="icon" href="/favicon.ico" />
    <style>
      :root {
        --bg: #f4f6f5;
        --card: #ffffff;
        --fg: #1f2933;
        --muted: #6b7280;
        --primary: #ffd512;
        --primary-fg: #1f2933;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #182229;
          --card: #1f2b33;
          --fg: #f4f6f5;
          --muted: #9aa5ad;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        background: var(--bg);
        color: var(--fg);
        font-family:
          "Inter",
          ui-sans-serif,
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
      }
      .card {
        width: 100%;
        max-width: 380px;
        background: var(--card);
        border-radius: 16px;
        padding: 32px 24px;
        text-align: center;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      }
      img {
        width: 72px;
        height: 72px;
        border-radius: 50%;
      }
      h1 {
        font-size: 22px;
        margin: 16px 0 8px;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0 0 24px;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.5;
      }
      button {
        width: 100%;
        border: 0;
        border-radius: 10px;
        padding: 12px 16px;
        font: inherit;
        font-weight: 600;
        background: var(--primary);
        color: var(--primary-fg);
        cursor: pointer;
      }
      button:hover {
        filter: brightness(0.95);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <img src="/icons/icon-192.png" alt="Marko Projects" />
      <h1>You're offline</h1>
      <p>
        Marko Projects needs an internet connection to load your projects and tasks. Check your
        connection and try again.
      </p>
      <button type="button" onclick="location.reload()">Retry</button>
    </main>
    <script>
      // Come back automatically as soon as the connection returns.
      window.addEventListener("online", () => location.reload());
    </script>
  </body>
</html>
